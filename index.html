<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Puff Tracker – Track &amp; Quit Smoking</title>
  <meta name="description"
    content="Track your smoking habits, monitor smoke-free days, log cravings, and quit gradually. Available for Android." />
  <meta name="keywords"
    content="smoking tracker, quit smoking, nicotine, cigarette tracker, vaping, IQOS, smoke free" />
  <meta name="theme-color" content="#3B82F6" />
  <link rel="canonical" href="https://pufftracker.app/" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://pufftracker.app/" />
  <meta property="og:title" content="Puff Tracker – Track &amp; Quit Smoking" />
  <meta property="og:description"
    content="Track your smoking habits, monitor smoke-free days, log cravings, and quit gradually." />
  <meta property="og:image" content="https://pufftracker.app/assets/images/main_graphics.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Puff Tracker – Track &amp; Quit Smoking" />
  <meta name="twitter:description"
    content="Track your smoking habits, monitor smoke-free days, log cravings, and quit gradually." />
  <meta name="twitter:image" content="https://pufftracker.app/assets/images/main_graphics.png" />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/images/app_icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/images/app_icon.png" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "MobileApplication",
    "name": "Puff Tracker",
    "operatingSystem": "ANDROID",
    "applicationCategory": "HealthApplication",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "url": "https://play.google.com/store/apps/details?id=com.pufftracker.app",
    "description": "Track smoking habits and quit gradually."
  }
  </script>

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <div class="lang-switcher">
    <button id="lang-select-btn" aria-haspopup="listbox" aria-expanded="false">
      <span id="lang-current">🇬🇧</span>
      <svg class="lang-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9l6 6 6-6" />
      </svg>
    </button>
    <ul id="lang-options" role="listbox" hidden>
      <li role="option" data-lang="cs" aria-selected="false">🇨🇿</li>
      <li role="option" data-lang="sk" aria-selected="false">🇸🇰</li>
      <li role="option" data-lang="en" aria-selected="true">🇬🇧</li>
    </ul>
  </div>
  <main>

    <section class="hero">
      <div class="hero-inner">
        <img class="icon" src="assets/images/app_icon.png" alt="Puff Tracker icon" />
        <h1>Puff Tracker</h1>
        <p class="tagline" id="tagline"></p>
        <div class="description-wrap">
          <p class="description" id="description"></p>
          <button class="toggle-btn" id="toggle-btn" onclick="toggleDesc()" aria-expanded="false"></button>
        </div>
        <a class="btn-play" id="btn-play" href="https://play.google.com/store/apps/details?id=com.pufftracker.app"
          target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path
              d="M3.18 23.76c.3.17.65.2.98.08l11.04-6.38-2.54-2.54-9.48 8.84zM.5 1.4A1.5 1.5 0 0 0 0 2.5v19a1.5 1.5 0 0 0 .5 1.1l.07.06 10.64-10.64v-.24L.57 1.34.5 1.4zM20.32 10.56l-2.98-1.72-2.84 2.84 2.84 2.84 3-1.74a1.5 1.5 0 0 0 0-2.22zM4.16.16 15.2 6.54l-2.54 2.54L3.18.24a1.1 1.1 0 0 1 .98-.08z" />
          </svg>
          <span id="btn-text"></span>
        </a>
        <img class="hero-graphic" src="assets/images/main_graphics.png" alt="Puff Tracker app preview" />
      </div>
    </section>

    <section class="features">
      <div class="section-inner">
        <h2 class="section-title" id="features-title"></h2>
        <div class="features-grid">
          <div class="feature">
            <div class="feature-icon">📊</div>
            <h3 id="f1-title"></h3>
            <p id="f1-desc"></p>
          </div>
          <div class="feature">
            <div class="feature-icon">📅</div>
            <h3 id="f2-title"></h3>
            <p id="f2-desc"></p>
          </div>
          <div class="feature">
            <div class="feature-icon">💭</div>
            <h3 id="f3-title"></h3>
            <p id="f3-desc"></p>
          </div>
          <div class="feature">
            <div class="feature-icon">💡</div>
            <h3 id="f4-title"></h3>
            <p id="f4-desc"></p>
          </div>
        </div>
      </div>
    </section>

    <section class="screenshots">
      <div class="section-inner">
        <h2 class="section-title" id="screenshots-title"></h2>
      </div>
      <div class="screenshots-track">
        <div class="phone">
          <img src="assets/images/screenshots/1.png" alt="Puff Tracker screen 1" loading="lazy" />
        </div>
        <div class="phone">
          <img src="assets/images/screenshots/2.png" alt="Puff Tracker screen 2" loading="lazy" />
        </div>
        <div class="phone">
          <img src="assets/images/screenshots/3.png" alt="Puff Tracker screen 3" loading="lazy" />
        </div>
      </div>
    </section>

    <footer>
      <p id="footer-copy"></p>
    </footer>

  </main>

  <script src="js/app.js"></script>
</body>

</html>
